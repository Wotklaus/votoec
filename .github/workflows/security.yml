name: Escaneo de secretos

on:
  push:
    branches: [main, qa, dev]
  pull_request:
    branches: [main, qa, dev]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks (historial completo)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Obtener todo el historial
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instalar gitleaks y verificar su checksum
        run: |
          archivo="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archivo" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archivo"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archivo" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archivo" -C "$RUNNER_TEMP" gitleaks

      # --redact evita que un secreto aparezca en los logs, que son públicos.
      - name: Escanear todas las ramas y etiquetas
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 --log-opts="--all" .
