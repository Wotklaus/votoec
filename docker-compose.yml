
services:
  frontend:
    build: ./frontend
    container_name: frontend-votoec
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: backend-votoec
    ports:
      - "5000:5000"
    environment:
      PRIVATE_KEY: ${PRIVATE_KEY}
      RPC_URL: ${RPC_URL}
      CONTRACT_ADDRESS: ${CONTRACT_ADDRESS}
      CHAIN_ID: ${CHAIN_ID}
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/votoec
      PG_USER: postgres
      PG_PASS: ${PG_PASS}
      PG_HOST: postgres
      PG_DB: votoec
      PG_PORT: 5432
      KAFKA_BROKER: kafka:9092
    depends_on:
      - mongo
      - postgres
      - kafka
    volumes:
      - ./backend:/app

  listener:
    build:
      context: ./backend
      dockerfile: Dockerfile.listener
    container_name: listener-votoec
    command: ["node", "src/listener/listener.js"]
    environment:
      PRIVATE_KEY: ${PRIVATE_KEY}
      RPC_URL: ${RPC_URL}
      RPC_WSS_URL: ${RPC_WSS_URL}
      CONTRACT_ADDRESS: ${CONTRACT_ADDRESS}
      CHAIN_ID: ${CHAIN_ID}
      MONGO_URI: mongodb://mongo:27017/votoec
      PG_USER: ${PG_USER}
      PG_PASS: ${PG_PASS}
      PG_HOST: postgres
      PG_DB: ${PG_DB}
      PG_PORT: 5432
      KAFKA_BROKERS: kafka:9092
    depends_on:
      - kafka
      - mongo
      - postgres    

  mongo:
    image: mongo:6
    container_name: mongo-votoec
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  postgres:
    image: postgres:15
    container_name: postgres-votoec
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_PASS}
      POSTGRES_DB: votoec
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/db:/docker-entrypoint-initdb.d

  
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: zookeeper-votoec
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    

  kafka: 
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka-votoec
    ports:
      - "9092-9092"
    depends_on:
      - zookeeper    
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092 #aqui camibar la IP por kafka 192.168.100.6
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    
volumes:
  mongo_data:
  pg_data:
